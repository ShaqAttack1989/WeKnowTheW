name: Weekly Heat Check sync

on:
  schedule:
    # Awards are normally published on Tuesday. Retry through Wednesday for late releases.
    - cron: '17 14-22/2 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-heat-check
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for newly published conference winners
        run: node scripts/update-weekly-awards.mjs
      - name: Publish an updated Heat Check when needed
        run: |
          if git diff --quiet; then
            echo "Weekly Heat Check is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stat-kitchen-data.js stat-kitchen.html
          git commit -m "Auto-update conference Players of the Week"
          git push
