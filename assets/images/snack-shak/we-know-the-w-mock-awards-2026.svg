  <text x="540" y="210" text-anchor="middle" class="cond cream" font-size="69" font-weight="1000" letter-spacing="2">WNBA AWARDS</text>
  <rect x="300" y="229" width="480" height="4" rx="2" fill="url(#coralPurple)"/>
  <text x="540" y="261" text-anchor="middle" class="sans muted" font-size="15" font-weight="800" letter-spacing="2.2">THE GRADES MADE THEIR CASE</text>

