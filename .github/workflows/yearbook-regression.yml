name: Yearbook Regression

on:
  push:
    paths:
      - 'season-yearbooks.html'
      - 'season-yearbooks.js'
      - 'season-yearbooks*.css'
      - 'api/yearbook-season.js'
      - 'api/yearbook-transactions.js'
      - 'scripts/freeze-season-yearbook.mjs'
      - 'tests/season-yearbooks.test.js'
      - '.github/workflows/yearbook-regression.yml'
  workflow_dispatch:

jobs:
  test-yearbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run W Rewind regression tests
        run: node --test tests/season-yearbooks.test.js
