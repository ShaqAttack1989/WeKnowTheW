name: Refresh On the Wire

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh WNBA story desk
        run: node scripts/update-on-the-wire.mjs

      - name: Save current desk and archive
        shell: bash
        run: |
          git config user.name "weknowthew-bot"
          git config user.email "weknowthew-bot@users.noreply.github.com"
          git add on-the-wire-current.json on-the-wire-archive.json
          if git diff --cached --quiet; then
            echo "No On the Wire changes to save."
            exit 0
          fi
          git commit -m "Refresh On the Wire daily feed"
          git pull --rebase origin main
          git push origin HEAD:main
