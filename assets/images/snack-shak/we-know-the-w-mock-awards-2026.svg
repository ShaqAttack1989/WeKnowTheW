    <line x1="78" y1="987" x2="496" y2="987" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(78 1008)"><circle cx="21" cy="21" r="21" fill="#ff6b55"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">04</text><text x="58" y="29" class="list-name cream">Jackie Young</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">94</text></g>
    <line x1="78" y1="1069" x2="496" y2="1069" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(78 1090)"><circle cx="21" cy="21" r="21" fill="#ff6b55"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">05</text><text x="58" y="29" class="list-name cream">Natasha Howard</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">94</text></g>
  </g>

