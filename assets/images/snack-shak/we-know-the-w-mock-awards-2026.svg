    <g transform="translate(584 762)"><circle cx="21" cy="21" r="21" fill="#6b2bd9"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">01</text><text x="58" y="29" class="list-name cream">Olivia Miles</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">95</text></g>
    <line x1="584" y1="823" x2="1002" y2="823" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(584 844)"><circle cx="21" cy="21" r="21" fill="#6b2bd9"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">02</text><text x="58" y="29" class="list-name cream">Kiki Rice</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">87</text></g>
    <line x1="584" y1="905" x2="1002" y2="905" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(584 926)"><circle cx="21" cy="21" r="21" fill="#6b2bd9"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">03</text><text x="58" y="29" class="list-name cream">Pauline Astier</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">85</text></g>
    <line x1="584" y1="987" x2="1002" y2="987" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(584 1008)"><circle cx="21" cy="21" r="21" fill="#6b2bd9"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">04</text><text x="58" y="29" class="list-name cream">Lauren Betts</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">83</text></g>
    <line x1="584" y1="1069" x2="1002" y2="1069" stroke="#654e83" stroke-opacity=".45"/>
    <g transform="translate(584 1090)"><circle cx="21" cy="21" r="21" fill="#6b2bd9"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">05</text><text x="58" y="29" class="list-name cream">Azzi Fudd</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">81</text></g>
