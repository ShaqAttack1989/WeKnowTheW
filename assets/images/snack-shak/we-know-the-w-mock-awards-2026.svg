  <g class="sans">
    <g transform="translate(78 762)"><circle cx="21" cy="21" r="21" fill="#ff6b55"/><text x="21" y="28" text-anchor="middle" class="cream" font-size="17" font-weight="1000">01</text><text x="58" y="29" class="list-name cream">A'ja Wilson</text><rect x="363" y="1" width="70" height="40" rx="20" fill="#241044"/><text x="398" y="27" text-anchor="middle" class="list-score lime">96</text></g>
