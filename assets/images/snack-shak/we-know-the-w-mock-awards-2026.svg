    <rect x="387" y="294" width="306" height="148" rx="24" fill="#140a2f" fill-opacity=".83" stroke="#b783ff" stroke-width="2"/>
    <rect x="726" y="294" width="306" height="148" rx="24" fill="#140a2f" fill-opacity=".83" stroke="#d8ff4f" stroke-width="2"/>
    <rect x="48" y="462" width="306" height="148" rx="24" fill="#140a2f" fill-opacity=".83" stroke="#ff6b55" stroke-width="2"/>
    <rect x="387" y="462" width="306" height="148" rx="24" fill="#140a2f" fill-opacity=".83" stroke="#b783ff" stroke-width="2"/>
    <rect x="726" y="462" width="306" height="148" rx="24" fill="#140a2f" fill-opacity=".83" stroke="#d8ff4f" stroke-width="2"/>
