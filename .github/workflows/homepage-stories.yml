name: Homepage stories validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/homepage-stories.yml'
      - 'homepage-*.js'
      - 'homepage-*.css'
      - 'snack-shak-*.json'
      - 'snack-shaq-posts.json'
      - 'index.html'
      - 'tests/homepage-*.test.js'
      - 'tests/site-repairs.test.js'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all homepage feeds and selection rules
        run: |
          node --check homepage-fresh-stories.js
          node --check homepage-specials.js
          node --check homepage-week-live.js
          node --check homepage-desk.js
          node -e "const fs=require('fs'); for(const url of require('./homepage-fresh-stories').feeds){const feed=JSON.parse(fs.readFileSync('.'+url,'utf8'));if(!Array.isArray(feed.posts))throw Error('Missing posts: '+url)}"
          node --test tests/homepage-fresh-stories.test.js tests/site-repairs.test.js tests/navigation-smoke.test.js
          node scripts/sync-site-mirror.cjs
