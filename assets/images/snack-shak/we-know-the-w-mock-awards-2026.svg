<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="arenaBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07030f"/>
      <stop offset="0.48" stop-color="#241044"/>
      <stop offset="1" stop-color="#090512"/>
    </linearGradient>
    <radialGradient id="arenaGlow" cx="50%" cy="18%" r="78%">
      <stop offset="0" stop-color="#a85cff" stop-opacity=".46"/>
      <stop offset=".42" stop-color="#ff6b55" stop-opacity=".18"/>
      <stop offset="1" stop-color="#07030f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="courtGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ff4f" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d8ff4f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b061a" stop-opacity="0.36"/>
      <stop offset="0.30" stop-color="#140a2f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0b061a" stop-opacity="0.91"/>
    </linearGradient>
    <linearGradient id="coralPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b55"/>
      <stop offset="1" stop-color="#a85cff"/>
    </linearGradient>
    <linearGradient id="purpleLime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b2bd9"/>
      <stop offset="1" stop-color="#d8ff4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: 'DejaVu Sans', Arial, sans-serif; }
      .cond { font-family: 'DejaVu Sans', Arial, sans-serif; font-stretch: condensed; }
      .cream { fill: #fffdf8; }
      .muted { fill: #d8cfea; }
      .coral { fill: #ff6b55; }
      .lime { fill: #d8ff4f; }
      .purple { fill: #b783ff; }
      .label { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
      .winner { font-size: 27px; font-weight: 900; letter-spacing: .2px; }
      .score { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
      .list-name { font-size: 24px; font-weight: 800; }
      .list-score { font-size: 18px; font-weight: 900; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#arenaBase)"/>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#arenaGlow)"/>
  <path d="M0 1110 L540 210 L1080 1110 Z" fill="none" stroke="#b783ff" stroke-opacity=".16" stroke-width="3"/>
  <path d="M160 1350 L540 250 L920 1350" fill="url(#courtGlow)" opacity=".36"/>
  <circle cx="80" cy="205" r="4" fill="#d8ff4f" opacity=".7"/>
  <circle cx="1015" cy="260" r="6" fill="#ff6b55" opacity=".7"/>
  <circle cx="930" cy="115" r="3" fill="#fffdf8" opacity=".58"/>
  <circle cx="145" cy="520" r="3" fill="#fffdf8" opacity=".42"/>
  <rect x="0" y="0" width="1080" height="1350" fill="url(#veil)"/>

  <!-- Brand rail -->
  <g transform="translate(48 38)">
    <rect width="62" height="62" rx="18" fill="#140a2f" stroke="#d8ff4f" stroke-width="3"/>
    <text x="31" y="43" text-anchor="middle" class="sans cream" font-size="37" font-weight="1000">W</text>
    <text x="82" y="25" class="sans cream" font-size="20" font-weight="900" letter-spacing="2.5">WE KNOW THE W</text>
    <text x="82" y="51" class="sans muted" font-size="13" font-weight="700" letter-spacing="1.6">WOMEN'S BASKETBALL, FROM A TO Z</text>
  </g>
  <g transform="translate(773 48)">
