  <!-- Footer -->
  <rect x="48" y="1230" width="984" height="1" fill="#b783ff" fill-opacity=".65"/>
  <text x="48" y="1267" class="sans muted" font-size="13" font-weight="800" letter-spacing="1.2">W SCORES THROUGH SEPT. 16, 2026 • EDITORIAL MOCK • NOT OFFICIAL WNBA AWARDS</text>
  <text x="1032" y="1267" text-anchor="end" class="sans lime" font-size="16" font-weight="1000" letter-spacing="1.5">WEKNOWTHEW.COM</text>
  <text x="540" y="1314" text-anchor="middle" class="sans cream" font-size="17" font-weight="900" letter-spacing="2.2">NUMBERS ON THE BOTTOM. SHAK'S TAKE ON TOP.</text>
