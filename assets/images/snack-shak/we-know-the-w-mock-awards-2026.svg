  <rect x="48" y="650" width="478" height="82" rx="30" fill="url(#coralPurple)"/>
  <rect x="48" y="700" width="478" height="32" fill="url(#coralPurple)"/>
  <rect x="554" y="650" width="478" height="82" rx="30" fill="url(#purpleLime)"/>
