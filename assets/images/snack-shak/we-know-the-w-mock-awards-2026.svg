    <text x="72" y="379" class="winner cream">A'JA WILSON</text>
    <text x="72" y="414" class="score lime">96 • A+</text>

    <text x="411" y="332" class="label purple">DPOY</text>
    <text x="411" y="379" class="winner cream">A'JA WILSON</text>
